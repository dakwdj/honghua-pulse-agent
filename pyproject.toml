[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "honghua-pulse-agent"
version = "0.1.0"
description = "AI agent workflow for pulsed-air safflower filament harvesting design"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pydantic>=2.7",
  "python-dotenv>=1.0",
  "requests>=2.31",
]

[project.optional-dependencies]
demo = ["streamlit>=1.33"]
test = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]
